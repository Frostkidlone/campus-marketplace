# Render blueprint for the Django API.
# Requires this project to be pushed to a Git repository and the repository to
# be connected in Render (Dashboard -> New -> Blueprint).
# See docs/DEPLOYMENT.md for the step-by-step procedure.

services:
  - type: web
    name: fupre-campus-marketplace-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_marketplace
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Paste the Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
